<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community report — Loudoun Data Center Watch</title>
    <meta
      name="description"
      content="A first-hand account from a Loudoun County resident about living beside a data center."
    />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="vendor/markercluster.css" />
    <link rel="stylesheet" href="vendor/markercluster.default.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <div class="demo-banner" hidden></div>
    <div id="watch-ticker" hidden></div>

    <main id="main">
      <div class="container container--narrow">
        <p class="breadcrumb">
          <a href="reports.html">&larr; All community reports</a>
        </p>

        <div id="report-detail">
          <noscript>
            <div class="empty-state">
              <p class="empty-state__title">This page needs JavaScript</p>
              <p>
                Individual reports are loaded from the database in the browser.
                <a href="reports.html">The full list</a> is the best place to start without it.
              </p>
            </div>
          </noscript>
        </div>

        <section class="section" aria-labelledby="detail-map-heading">
          <h2 id="detail-map-heading" class="section__title">Approximate location</h2>
          <p class="muted">
            The pin below is offset 100&ndash;200 metres from the address the resident gave. It is
            close enough to show which neighbourhood is affected and not close enough to identify a
            household.
          </p>
          <div class="map-shell">
            <div class="map map--compact" id="detail-map"></div>
          </div>
        </section>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="vendor/leaflet.js"></script>
    <script src="vendor/markercluster.js"></script>
    <script src="js/config.js"></script>
    <script src="js/schema.js"></script>
    <script src="js/local-store.js"></script>
    <script src="js/supabase-store.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/map-layers.js"></script>
    <script src="js/map-tools.js"></script>
    <script src="js/map.js"></script>
    <script src="js/report-detail.js"></script>
    <script src="js/watchlist.js"></script>
  </body>
</html>
